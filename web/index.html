<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>法大成绩提醒</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">成</div>
        <div class="brand-text">
          <h1>法大成绩提醒</h1>
          <p>配置 · 查看 · 监控</p>
        </div>
      </div>
      <div class="status" id="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">读取中…</span>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="config">账号与通知</button>
      <button class="tab" data-tab="grades">已出科目</button>
      <button class="tab" data-tab="monitor">监控</button>
    </nav>

    <main>
      <section class="panel active" id="panel-config">
        <div class="card">
          <div class="card-head">
            <h2>账号</h2>
            <p class="hint">使用「智慧法大」统一认证的学号与密码。教务系统单独的密码不可用。</p>
          </div>
          <div class="grid">
            <label class="field">
              <span>学号</span>
              <input id="username" type="text" placeholder="留空表示不修改" autocomplete="username">
            </label>
            <label class="field">
              <span>密码</span>
              <input id="password" type="password" placeholder="留空表示不修改" autocomplete="current-password">
            </label>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>通知</h2>
            <p class="hint">群机器人安全设置请选「加签」，或「自定义关键词：成绩」。不要用 IP 白名单。</p>
          </div>
          <div class="grid">
            <label class="field">
              <span>渠道</span>
              <select id="channel">
                <option value="dingtalk">钉钉群机器人</option>
                <option value="feishu">飞书群机器人</option>
                <option value="none">暂不推送</option>
              </select>
            </label>
            <label class="field">
              <span>加签密钥</span>
              <input id="secret" type="text">
            </label>
          </div>
          <label class="field">
            <span>Webhook 地址</span>
            <input id="webhook" type="text">
          </label>
        </div>

        <div class="actions">
          <button class="btn primary" id="btnSave">保存配置</button>
          <button class="btn" id="btnTestLogin">读取本学期已出科目</button>
          <button class="btn" id="btnTestNotify">发送测试消息</button>
        </div>
      </section>

      <section class="panel" id="panel-grades">
        <div class="term-head">
          <h2 id="termTitle">本学期已出科目</h2>
          <p class="hint" id="termSub"></p>
        </div>
        <div class="stats" id="stats"></div>
        <div class="card">
          <div class="toolbar">
            <input id="search" type="search" placeholder="搜索科目…">
            <span class="count" id="gradeCount"></span>
          </div>
          <div class="table-wrap">
            <table id="gradeTable">
              <thead>
                <tr><th class="idx-col">#</th><th>科目</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <p class="empty" id="gradeEmpty">正在读取本学期出分情况…</p>
        </div>
      </section>

      <section class="panel" id="panel-monitor">
        <div class="card">
          <div class="card-head">
            <h2>本机监控</h2>
            <p class="hint">开启后每 N 分钟自动检查一次。关闭这个窗口就会停止；想 24 小时运行请用 GitHub Actions 或 Windows 计划任务。</p>
          </div>
          <div class="grid">
            <label class="field">
              <span>检查间隔</span>
              <select id="interval">
                <option value="5">5 分钟</option>
                <option value="10" selected>10 分钟</option>
                <option value="15">15 分钟</option>
                <option value="30">30 分钟</option>
              </select>
            </label>
            <div class="field">
              <span>当前状态</span>
              <div class="switch-row">
                <span class="badge" id="schedState">未启动</span>
                <button class="btn small" id="btnSchedToggle">启动</button>
              </div>
            </div>
          </div>
          <div class="actions">
            <button class="btn primary" id="btnRunNow">立即检查一次</button>
            <button class="btn danger" id="btnReset">清空基线</button>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h2>运行记录</h2></div>
          <ul class="runs" id="runs"></ul>
          <p class="empty" id="runsEmpty">还没有运行记录。</p>
        </div>
      </section>
    </main>

    <footer class="foot">只查询本人成绩 · 凭据仅保存在本机 config/.env · 请遵守学校信息系统使用规定</footer>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
