name: 成绩更新监控（定时已停用）

# ⚠️ 2026-11-06 实测：GitHub Actions 的 runner 全部在境外，
#    访问 http://jwxt.cupl.edu.cn:80 一律 ConnectTimeout
#    （同一轮里 tpass:443 与 RSA 公钥接口都 PASS，说明是目标侧限制，不是断网）。
#    因此这里的 cron 已注释掉——留着只会每 10 分钟失败一次，还会污染仓库提交历史。
#    定时检查改由本机 Windows 计划任务执行，见 docs/本机计划任务.md。
#    若将来把 runner 换成国内出口（自建 runner / 云函数），把下面两行取消注释即可。

on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只验证登录与解析，不推送、不写快照"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: grade-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 随机错峰（0-240 秒）
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 240))

      - name: 执行成绩检查
        env:
          CUPL_USERNAME: ${{ secrets.CUPL_USERNAME }}
          CUPL_PASSWORD: ${{ secrets.CUPL_PASSWORD }}
          AUTH_MODE: tpass
          NOTIFY_CHANNEL: ${{ secrets.NOTIFY_CHANNEL }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python src/monitor.py

      - name: 回写成绩快照
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "快照无变化，跳过提交"
            exit 0
          fi
          git config user.name "grade-alert-bot"
          git config user.email "grade-alert-bot@users.noreply.github.com"
          git add state/grades.json
          git commit -m "chore: 更新成绩快照 [skip ci]"
          git push
